<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening YouTube...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.box{
    text-align:center;
}

.logo{
    width:74px;
    height:52px;
    background:#FF0000;
    border-radius:14px;
    margin:auto;
    position:relative;
    animation:pulse 1.2s infinite;
}

.logo:before{
    content:"";
    position:absolute;
    left:30px;
    top:14px;
    border-left:18px solid #fff;
    border-top:11px solid transparent;
    border-bottom:11px solid transparent;
}

.title{
    margin-top:20px;
    font-size:26px;
    font-weight:700;
    color:#111;
}

.loading{
    margin-top:10px;
    color:#666;
    font-size:17px;
}

.loading::after{
    content:"";
    animation:dots 1.2s infinite;
}

.tip{
    margin-top:18px;
    font-size:14px;
    color:#999;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

@keyframes dots{
    0%{content:"";}
    33%{content:".";}
    66%{content:"..";}
    100%{content:"...";}
}
</style>
</head>

<body>

<div class="box">
    <div class="logo"></div>

    <div class="title">YouTube</div>

    <div class="loading">
        Opening YouTube
    </div>

    <div class="tip">
        Please wait while YouTube launches
    </div>
</div>

<script>
const h = new URLSearchParams(location.search).get("h");

if(h){
    const user = h.replace(/^@/, "");

    requestAnimationFrame(() => {
        location.href = `intent://www.youtube.com/@${encodeURIComponent(user)}#Intent;scheme=https;package=com.google.android.youtube;end`;

        setTimeout(() => {
            location.replace(`https://www.youtube.com/@${encodeURIComponent(user)}`);
        }, 200);
    });
}
</script>

</body>
</html>
