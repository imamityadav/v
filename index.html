<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
}

.box{
    width:100%;
    text-align:center;
    padding-top:8vh;
}

.badge{
    width:82px;
    height:82px;
    margin:auto;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:36px;
    font-weight:800;
    animation:pulse 1.2s infinite;
    user-select:none;
}

.youtube{
    background:#ff0000;
    border-radius:18px;
}

.instagram{
    background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);
}

.facebook{
    background:#1877f2;
    border-radius:50%;
}

.channel{
    margin-top:22px;
    font-size:32px;
    font-weight:800;
    color:#111;
    padding:0 20px;
    word-break:break-word;
}

.opening{
    margin-top:10px;
    font-size:18px;
    color:#666;
    font-weight:600;
    animation:textPulse 1.2s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

@keyframes textPulse{
    0%,100%{
        opacity:.55;
    }
    50%{
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="box">

<div id="badge" class="badge">Y</div>

<div id="channel" class="channel">
Loading...
</div>

<div id="opening" class="opening">
Opening...
</div>

</div>

<script>
const p = new URLSearchParams(location.search);

let user = "";
let app = "";
let web = "";
let cls = "youtube";
let icon = "Y";

if (p.has("y")) {
    user = p.get("y").replace(/^@/, "");
    cls = "youtube";
    icon = "▶";
    app = `intent://www.youtube.com/@${encodeURIComponent(user)}#Intent;scheme=https;package=com.google.android.youtube;end`;
    web = `https://www.youtube.com/@${encodeURIComponent(user)}`;
}
else if (p.has("i")) {
    user = p.get("i").replace(/^@/, "");
    cls = "instagram";
    icon = "I";
    app = `instagram://user?username=${encodeURIComponent(user)}`;
    web = `https://instagram.com/${encodeURIComponent(user)}`;
}
else if (p.has("f")) {
    user = p.get("f").replace(/^@/, "");
    cls = "facebook";
    icon = "F";
    app = `fb://facewebmodal/f?href=https://facebook.com/${encodeURIComponent(user)}`;
    web = `https://facebook.com/${encodeURIComponent(user)}`;
}
else{
    document.getElementById("channel").textContent="Invalid Link";
    document.getElementById("opening").textContent="Missing parameter";
    throw "";
}

const badge=document.getElementById("badge");

badge.className="badge "+cls;
badge.textContent=icon;

document.getElementById("channel").textContent=user;
document.getElementById("opening").textContent="Opening "+user;

requestAnimationFrame(()=>{

    location.href=app;

    setTimeout(()=>{
        location.replace(web);
    },200);

});
</script>

</body>
</html>
