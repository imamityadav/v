<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Open YouTube</title>
</head>
<body>

<script>
const params = new URLSearchParams(window.location.search);
let handle = params.get("handle");

if (handle) {
    handle = handle.replace(/^@/, "");

    const webUrl = `https://www.youtube.com/@${encodeURIComponent(handle)}`;
    const intentUrl = `intent://www.youtube.com/@${encodeURIComponent(handle)}#Intent;scheme=https;package=com.google.android.youtube;end`;

    window.location.href = intentUrl;

    setTimeout(() => {
        window.location.href = webUrl;
    }, 1200);
} else {
    document.body.innerHTML = "Missing handle";
}
</script>

</body>
</html>
