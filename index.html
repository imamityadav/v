<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open App</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    font-family:system-ui,sans-serif;
}

button{
    padding:16px 28px;
    font-size:18px;
    font-weight:600;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

button:active{
    transform:scale(.98);
}
</style>
</head>
<body>

<button id="openBtn">Tap to Open </button>
<script>
const p = new URLSearchParams(location.search);

let app = "";

if (p.has("y")) {
    const u = p.get("y").replace(/^@/, "");
    app = `intent://www.youtube.com/@${encodeURIComponent(u)}#Intent;scheme=https;package=com.google.android.youtube;end`;
}
else if (p.has("i")) {
    const u = p.get("i").replace(/^@/, "");
    app = `instagram://user?username=${encodeURIComponent(u)}`;
}
else if (p.has("f")) {
    const u = p.get("f").replace(/^@/, "");
    app = `fb://facewebmodal/f?href=https://facebook.com/${encodeURIComponent(u)}`;
}

function openApp() {
    if (app) location.href = app;
}

document.getElementById("openBtn").onclick = openApp;

// Try immediately on page load
if (app) openApp();
</script>

</body>
</html>
