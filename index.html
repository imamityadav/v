<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening YouTube...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.box{
    text-align:center;
    padding:20px;
}

.logo{
    width:74px;
    height:52px;
    background:#FF0000;
    border-radius:14px;
    margin:auto;
    position:relative;
    animation:logoPulse 1.4s infinite;
}

.logo:before{
    content:"";
    position:absolute;
    left:30px;
    top:14px;
    border-left:18px solid #fff;
    border-top:11px solid transparent;
    border-bottom:11px solid transparent;
}

.channel{
    margin-top:20px;
    font-size:32px;
    font-weight:800;
    color:#111;
    word-break:break-word;
}

.opening{
    margin-top:12px;
    font-size:18px;
    font-weight:600;
    color:#666;
    animation:textPulse 1.1s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

@keyframes textPulse{
    0%,100%{
        opacity:.55;
        transform:scale(1);
    }
    50%{
        opacity:1;
        transform:scale(1.04);
    }
}
</style>
</head>

<body>

<div class="box">
    <div class="logo"></div>

    <div id="channel" class="channel">YouTube</div>

    <div id="opening" class="opening">
        Opening...
    </div>
</div>

<script>
const h = new URLSearchParams(location.search).get("h");

if (h) {
    const user = h.replace(/^@/, "");

    document.getElementById("channel").textContent = user;
    document.getElementById("opening").textContent = "Opening " + user;

    requestAnimationFrame(() => {

        // Try to open the YouTube app
        location.href =
        `intent://www.youtube.com/@${encodeURIComponent(user)}#Intent;scheme=https;package=com.google.android.youtube;end`;

        // Fallback to website
        setTimeout(() => {
            location.replace(
                `https://www.youtube.com/@${encodeURIComponent(user)}`
            );
        }, 200);

    });
} else {
    document.getElementById("channel").textContent = "Channel not found";
    document.getElementById("opening").textContent = "Please Check Youtube Channel Handle";
}
</script>

</body>
</html>
