<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open YouTube</title>
</head>
<body>

<script>
let handle = decodeURIComponent(location.pathname.split("/").pop());

if (!handle || handle === "v") {
    document.body.innerHTML = "<h2>Missing YouTube Handle</h2>";
} else {
    handle = handle.replace(/^@/, "");

    const webUrl = `https://www.youtube.com/@${encodeURIComponent(handle)}`;
    const intentUrl = `intent://www.youtube.com/@${encodeURIComponent(handle)}#Intent;scheme=https;package=com.google.android.youtube;end`;

    location.href = intentUrl;

    setTimeout(() => {
        location.href = webUrl;
    }, 1200);
}
</script>

</body>
</html>
