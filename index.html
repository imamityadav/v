<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Social Account Directly in App</title>

<script>
(() => {
const q = new URLSearchParams(location.search);
const ua = navigator.userAgent;

const android = /Android/i.test(ua);
const ios = /iPhone|iPad|iPod/i.test(ua);

let app="",web="",u="";

if(q.has("y")){
    u=q.get("y").replace(/^@/,"");
    web=`https://www.youtube.com/@${encodeURIComponent(u)}`;

    app=android
        ?`intent://www.youtube.com/@${encodeURIComponent(u)}#Intent;scheme=https;package=com.google.android.youtube;end`
        :web;
}
else if(q.has("i")){
    u=q.get("i").replace(/^@/,"");
    web=`https://www.instagram.com/${encodeURIComponent(u)}/`;

    app=ios
        ?`instagram://user?username=${encodeURIComponent(u)}`
        :android
        ?`instagram://user?username=${encodeURIComponent(u)}`
        :web;
}
else if(q.has("f")){
    u=q.get("f").replace(/^@/,"");
    web=`https://www.facebook.com/${encodeURIComponent(u)}`;

    app=ios
        ?`fb://profile/${encodeURIComponent(u)}`
        :android
        ?`fb://facewebmodal/f?href=${encodeURIComponent(web)}`
        :web;
}
else{
    return;
}

location.replace(android||ios ? app : web);

})();
</script>

</head>
<body></body>
</html>
