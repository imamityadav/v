<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open YouTube</title>
<script>
const h = new URLSearchParams(location.search).get("h");

if (h) {
    const u = h.replace(/^@/, "");

    location.href =
        `intent://www.youtube.com/@${encodeURIComponent(u)}#Intent;scheme=https;package=com.google.android.youtube;end`;

    setTimeout(() => {
        location.replace(`https://www.youtube.com/@${encodeURIComponent(u)}`);
    }, 1000);
} else {
    document.body.textContent = "Missing handle";
}
</script>
</head>
<body></body>
</html>
