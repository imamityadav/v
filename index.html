<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening YouTube...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
}

.box{
    width:100%;
    text-align:center;
    padding-top:8vh;
}

.logo{
    width:78px;
    height:56px;
    background:#FF0000;
    border-radius:14px;
    margin:0 auto;
    position:relative;
    animation:logoPulse 1.4s ease-in-out infinite;
}

.logo:before{
    content:"";
    position:absolute;
    left:31px;
    top:15px;
    border-left:19px solid #fff;
    border-top:12px solid transparent;
    border-bottom:12px solid transparent;
}

.channel{
    margin-top:20px;
    font-size:32px;
    font-weight:800;
    color:#111;
    padding:0 20px;
    word-break:break-word;
}

.opening{
    margin-top:12px;
    font-size:18px;
    font-weight:600;
    color:#666;
    animation:textPulse 1.1s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

@keyframes textPulse{
    0%,100%{
        opacity:.55;
        transform:scale(1);
    }
    50%{
        opacity:1;
        transform:scale(1.04);
    }
}
</style>
</head>

<body>

<div class="box">
    <div class="logo"></div>

    <div id="channel" class="channel">Loading...</div>

    <div id="opening" class="opening">
        Opening YouTube
    </div>
</div>

<script>
const h = new URLSearchParams(location.search).get("h");

if (h) {
    const user = h.replace(/^@/, "");

    document.getElementById("channel").textContent = user;
    document.getElementById("opening").textContent = "Opening " + user + " in YouTube";

    requestAnimationFrame(() => {

        // Try opening the YouTube app
        location.href =
            `intent://www.youtube.com/@${encodeURIComponent(user)}#Intent;scheme=https;package=com.google.android.youtube;end`;

        // Fallback to website if app doesn't open
        setTimeout(() => {
            location.replace(
                `https://www.youtube.com/@${encodeURIComponent(user)}`
            );
        }, 200);

    });

} else {
    document.getElementById("channel").textContent = "Channel Not Found";
    document.getElementById("opening").textContent = "Missing URL parameter: h";
}
</script>

</body>
</html>
